<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Authentication</title>

    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />

    <!-- Firebase SDKs (UMD versions for browser use) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


    <!-- Your Firebase config + initialization -->
    <script src="firebaseDB.js"></script>
</head>

<body>
    <nav>
        <div class="nav-wrapper red darken-2">
            <a href="#" class="brand-logo center">Emergency Prep App</a>
        </div>
    </nav>

    <div class="container" style="margin-top:2rem;">
        <!-- Sign In Form -->
        <form id="signInForm" class="card-panel">
            <h5>Sign In</h5>
            <div class="input-field">
                <input type="text" id="signInName" required />
                <label for="signInName">Name</label>
            </div>
            <div class="input-field">
                <input type="email" id="signInEmail" required />
                <label for="signInEmail">Email</label>
            </div>
            <div class="input-field">
                <input type="password" id="signInPassword" required />
                <label for="signInPassword">Password</label>
            </div>
            <button class="btn red darken-2" type="submit">Sign In</button>
            <p class="switch-link">
                <a href="#" onclick="toggleForms('signup')">Need an account? Sign Up</a>
            </p>
        </form>

        <!-- Sign Up Form -->
        <form id="signUpForm" class="card-panel" style="display:none;">
            <h5>Sign Up</h5>
            <div class="input-field">
                <input type="text" id="signUpName" required />
                <label for="signUpName">Name</label>
            </div>
            <div class="input-field">
                <input type="email" id="signUpEmail" required />
                <label for="signUpEmail">Email</label>
            </div>
            <div class="input-field">
                <input type="password" id="signUpPassword" required />
                <label for="signUpPassword">Password</label>
            </div>
            <button class="btn red darken-2" type="submit">Create Account</button>
            <p class="switch-link">
                <a href="#" onclick="toggleForms('signin')">Already have an account? Sign In</a>
            </p>
        </form>

        <!-- Logout Button -->
        <button id="logoutBtn" class="btn red darken-2" style="display:none;">Logout</button>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- Auth logic -->
    <script src="auth.js"></script>

    <script>
        function toggleForms(form) {
            if (form === 'signup') {
                document.getElementById("signInForm").style.display = "none";
                document.getElementById("signUpForm").style.display = "block";
            } else {
                document.getElementById("signUpForm").style.display = "none";
                document.getElementById("signInForm").style.display = "block";
            }
        }
    </script>
</body>

</html>
