<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Prep App</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b71c1c" />
</head>

<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-wrapper red darken-2">
      <a href="#" class="brand-logo center">Emergency Prep</a>
    </div>
  </nav>

  <div class="container">
    <!-- Auth Panel -->
    <div id="authPanel" class="card-panel" style="margin-top:2rem;">
      <div id="authStatus" class="center-align"></div>
      <div class="center-align">
        <a href="notes.html" id="goToNotesBtn" class="btn green darken-2" style="display:none;">Go to Notes</a>
        <button id="logoutBtn" class="btn red darken-2" style="display:none;">Logout</button>
      </div>
    </div>

    <!-- Header -->
    <h5 class="center-align">Emergency Prep Toolkit</h5>
    <div class="center-align">
      <img src="homeicon.png" alt="Emergency Prep Toolkit" class="responsive-img" style="max-width:120px;" />
    </div>

    <!-- Task Form -->
    <div class="row">
      <form id="taskForm" class="col s12 card-panel">
        <input type="hidden" id="taskId" value="" />
        <div class="input-field">
          <input id="taskTitle" type="text" required />
          <label for="taskTitle">Task Title</label>
        </div>
        <div class="input-field">
          <textarea id="taskDescription" class="materialize-textarea"></textarea>
          <label for="taskDescription">Task Description</label>
        </div>
        <button class="btn red darken-2 waves-effect waves-light" type="submit">
          <i class="material-icons left">add</i>Add Task
        </button>
      </form>
    </div>

    <!-- Task List -->
    <div id="taskListContainer" class="row"></div>

    <!-- Essentials Categories -->
    <ul class="collapsible popout">
      <!-- [Your collapsible checklist sections go here — unchanged] -->
    </ul>

    <!-- Add Folder Button -->
    <div class="center-align" style="margin-top: 2rem;">
      <button class="btn red darken-2" onclick="createNewFolder()">
        <i class="material-icons left">create_new_folder</i>Create Another Folder
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
  <script src="firebaseDB.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>

  <!-- Auth Logic -->
  <script>
    firebase.auth().onAuthStateChanged(user => {
      const status = document.getElementById("authStatus");
      const notesBtn = document.getElementById("goToNotesBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      if (user) {
        status.innerHTML = `Welcome, <strong>${user.name}</strong>`;
        notesBtn.style.display = "inline-block";
        logoutBtn.style.display = "inline-block";
      } else {
        status.innerHTML = `<a href="auth.html" class="btn red darken-2">Sign In</a>`;
        notesBtn.style.display = "none";
        logoutBtn.style.display = "none";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await firebase.auth().signOut();
      M.toast({ html: "Logged out!", classes: "blue darken-2" });
    });
  </script>

  <!-- Folder Logic -->
  <script>
    function createNewFolder() {
      const collapsibleList = document.querySelector(".collapsible");
      const folderName = "New Folder";
      const id = Date.now();
      let folders = JSON.parse(localStorage.getItem("folders")) || [];
      folders.push({ id, name: folderName, items: ["Example item"] });
      localStorage.setItem("folders", JSON.stringify(folders));
      renderFolder(id, folderName, ["Example item"], collapsibleList);
    }

    function renderFolder(id, name, items, collapsibleList) {
      const li = document.createElement("li");
      const header = document.createElement("div");
      header.className = "collapsible-header";
      const icon = document.createElement("i");
      icon.className = "material-icons";
      icon.textContent = "folder";
      const editableTitle = document.createElement("span");
      editableTitle.textContent = name;
      editableTitle.contentEditable = true;
      editableTitle.style.outline = "none";
      editableTitle.style.marginLeft = "10px";
      editableTitle.style.cursor = "text";
      editableTitle.addEventListener("blur", () => {
        let folders = JSON.parse(localStorage.getItem("folders")) || [];
        const idx = folders.findIndex(f => f.id === id);
        if (idx !== -1) {
          folders[idx].name = editableTitle.textContent.trim() || "New Folder";
          localStorage.setItem("folders", JSON.stringify(folders));
        }
      });
      header.appendChild(icon);
      header.appendChild(editableTitle);

      const body = document.createElement("div");
      body.className = "collapsible-body";
      const ul = document.createElement("ul");
      ul.className = "collection";

      items.forEach((item, itemIdx) => {
        const liItem = document.createElement("li");
        liItem.className = "collection-item";
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        const editableItem = document.createElement("span");
        editableItem.textContent = item;
        editableItem.contentEditable = true;
        editableItem.style.outline = "none";
        editableItem.style.cursor = "text";
        editableItem.addEventListener("blur", () => {
          let folders = JSON.parse(localStorage.getItem("folders")) || [];
          const idx = folders.findIndex(f => f.id === id);
          if (idx !== -1) {
            folders[idx].items[itemIdx] = editableItem.textContent.trim() || "New Item";
            localStorage.setItem("folders", JSON.stringify(folders));
          }
        });
        label.appendChild(checkbox);
        label.appendChild(editableItem);
        liItem.appendChild(label);
        ul.appendChild(liItem);
      });

      body.appendChild(ul);
      li.appendChild(header);
      li.appendChild(body);
      collapsibleList.appendChild(li);
      M.Collapsible.init(collapsibleList);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const collapsibleList = document.querySelector(".collapsible");
      const folders = JSON.parse(localStorage.getItem("folders")) || [];
      folders.forEach(folder => renderFolder(folder.id, folder.name, folder.items, collapsibleList));
    });
  </script>
</body>
</html>
